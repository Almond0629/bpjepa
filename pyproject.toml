[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bpjepa"
version = "1.0.0"
description = "Code for 'Teaching V-JEPA When Events Happen: Label-Free Boundary Prediction for Action Spotting' (LVR @ WACV 2027)"
readme = "README.md"
license = {text = "MIT AND CECILL-2.1"}
requires-python = ">=3.10,<3.11"
# Core: pretraining, evidence and analysis. Exact historical stacks: environment/.
dependencies = ["numpy", "scipy", "pillow", "torch>=2.0", "torchvision>=0.15"]

[project.optional-dependencies]
evidence = ["opencv-python-headless"]
downstream = ["numpy<2", "setuptools<70", "torch>=2.0,<2.12", "torchvision>=0.15,<0.27", "lightning==2.0.9.post0", "pytorch-lightning==2.0.9.post0",
              "hydra-core==1.3.3", "omegaconf==2.3.1", "torchaug==0.3.3", "pytorchvideo==0.1.5", "timm==0.6.13", "einops", "SoccerNet==0.1.62", "tensorboard==2.20.0", "torchmetrics==0.11.4", "matplotlib", "scikit-learn", "pandas"]
dev = ["pytest"]

[project.scripts]
bpjepa-clip-manifest = "bpjepa.jepa.full_data:main"
bpjepa-evidence = "bpjepa.evidence.pipeline:main"
bpjepa-pretrain = "bpjepa.pretrain.train:main"
bpjepa-export = "bpjepa.downstream.export:main"
bpjepa-finetune = "bpjepa.downstream.finetune:main"
bpjepa-frozen-cache = "bpjepa.downstream.frozen_cache:main"
bpjepa-frozen-head = "bpjepa.downstream.frozen_head:main"
bpjepa-analyze-spotting = "bpjepa.analysis.analyze_spotting:main"
bpjepa-probes-prepare = "bpjepa.probes.prepare:main"
bpjepa-probes-extract = "bpjepa.probes.extract:main"
bpjepa-probes-analyze = "bpjepa.probes.analyze:main"
bpjepa-audit = "bpjepa.analysis.audit.cli:main"
bpjepa-paper = "bpjepa.analysis.paper_tables:main"
bpjepa-fig2 = "bpjepa.analysis.fig2_evidence:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bpjepa*", "eztorch*"]

[tool.setuptools.package-data]
eztorch = ["configs/**/*.yaml"]
