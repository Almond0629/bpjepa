# COMEDIAN stage3 recipe as run for the paper (resolved config, machine paths replaced by paths.*).
# Set paths.* on the Hydra command line; see REPRODUCE.md.
callbacks:
  model_checkpoint:
    _target_: eztorch.callbacks.ModelCheckpoint
    dirpath: checkpoints
    filename: '{epoch}'
    save_last: true
    save_top_k: 1
    mode: max
    every_n_epochs: 5
    monitor: tight_Average_mAP/mAP
  learning_rate_monitor:
    _target_: eztorch.callbacks.LearningRateMonitor
    logging_interval: null
    log_momentum: false
  progress_bar:
    _target_: eztorch.callbacks.TQDMProgressBar
    refresh_rate: 50
    process_position: 0
datamodule:
  _target_: eztorch.datamodules.SoccerNetDataModule
  _recursive_: false
  datadir: ''
  train:
    dataset:
      datadir: ${paths.frames}/train.json
      video_path_prefix: ${paths.frames}/train
      label_args:
        cache_dir: ${paths.label_cache}/train
        radius_label: 0.5
      feature_args: null
      task: action
    decoder_args:
      fps: 2
      num_threads_io: 4
      num_threads_decode: 4
      num_decode: 1
      time_difference_prob: 0.0
      mask_ratio: 0.0
      mask_tube: 2
      transform: null
    clip_sampler:
      _target_: eztorch.datasets.clip_samplers.soccernet.UniformWindowWithoutOverlapSoccerNetClipSampler
      window_duration: 64.0
      windows_per_video: 50
      sample_edges: true
      prevent_resample_edges: true
      shuffle: true
    loader:
      drop_last: true
      num_workers: 4
      pin_memory: true
      shuffle: false
    global_batch_size: 32
    transform: null
  val:
    dataset:
      datadir: ${paths.frames}/valid.json
      video_path_prefix: ${paths.frames}/valid
      label_args:
        cache_dir: ${paths.label_cache}/valid
        radius_label: 0.5
      feature_args: null
      task: action
    decoder_args:
      fps: 2
      num_threads_io: 4
      num_threads_decode: 4
      num_decode: 1
      time_difference_prob: 0.0
      mask_ratio: 0.0
      mask_tube: 2
      transform: null
    clip_sampler:
      _target_: eztorch.datasets.clip_samplers.soccernet.SlidingWindowSoccerNetClipSampler
      window_duration: 64.0
      overlap_window: 32
      shuffle: true
    loader:
      drop_last: false
      num_workers: 4
      pin_memory: true
      shuffle: false
    global_batch_size: 16
    transform: null
  test:
    dataset:
      datadir: /val.json
      video_path_prefix: /
      label_args:
        cache_dir: ???
        radius_label: 0.5
      feature_args: null
      task: action
    decoder_args:
      fps: 2
      num_threads_io: 4
      num_threads_decode: 4
      num_decode: 1
      time_difference_prob: 0.0
      mask_ratio: 0.0
      mask_tube: 2
      transform: null
    clip_sampler:
      _target_: eztorch.datasets.clip_samplers.soccernet.SlidingWindowSoccerNetClipSampler
      window_duration: 64.0
      overlap_window: 32
      shuffle: true
    loader:
      drop_last: false
      num_workers: 8
      pin_memory: true
      shuffle: false
    transform: null
    global_batch_size: 64
  video_path_prefix: ''
  decoder: frame
  decoder_args:
    fps: 2
    num_threads_io: 4
    num_threads_decode: 4
    num_decode: 1
    time_difference_prob: 0.0
    transform: null
    mask_ratio: 0.0
    mask_tube: 2
model:
  trunk:
    _target_: eztorch.models.trunks.create_vitransformer_token_handler_model
    _recursive_: false
    return_cls_token: false
    return_cls_and_other_tokens: false
    flatten_tokens: false
    average_tokens: false
    separate_spatial_temporal: false
    detach_temporal: false
    transformer:
      _target_: eztorch.models.trunks.create_vivit_tiny
      num_frames: 128
      img_size: 224
      patch_size: 16
      spatial_class_token: true
      temporal_class_token: false
      temporal_num_heads: 3
      in_chans: 3
      temporal_depth: 6
      dropout_p: 0.1
      dropout_rate: 0.0
      attention_dropout_rate: 0.0
      time_dropout_rate: 0.0
      tube_size: 2
      conv_type: Conv3d
      use_learnable_pos_emb: true
      use_learnable_time_emb: true
      freeze_spatial: false
      temporal_mask_token: true
      temporal_mask_ratio: 0.25
      temporal_mask_tube: 2
      pretrain_pth: null
      weights_from: spatial
      copy_strategy: repeat
      extend_strategy: temporal_avg
  head_class:
    _target_: eztorch.models.heads.LinearHead
    bias: true
    dropout: 0.0
    dropout_inplace: true
    input_dim: 192
    norm_layer: null
    output_dim: 17
  _target_: eztorch.models.soccernet_spotting.SoccerNetSpottingModel
  _recursive_: false
  optimizer:
    _target_: eztorch.optimizers.optimizer_factory
    _recursive_: false
    exclude_wd_norm: true
    exclude_wd_bias: true
    name: adamw
    params:
      weight_decay: 0.05
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      amsgrad: false
    batch_size: 32
    initial_lr: 0.001
    layer_decay_lr: null
    scaler: linear
    scheduler:
      _target_: eztorch.schedulers.scheduler_factory
      _recursive_: false
      name: linear_warmup_cosine_annealing_lr
      params:
        max_epochs: 20
        warmup_epochs: 0
        warmup_start_lr: 1.0e-05
        eta_min: 1.0e-05
      interval: step
    keys_without_decay:
    - pos_embed
    - spatial_cls_token
    - temporal_cls_token
    - time_embed
    - temporal_mask_token
  pretrained_trunk_path: null
  pretrained_path: ${paths.stage3_classifier_checkpoint}
  loss_fn_args:
    class_weights:
      type: null
    class_loss_type: bce
    alpha: -1
    gamma: 2.0
  eval_step_timestamp: 0.5
  freeze_trunk: false
  train_transform:
    _target_: torch.nn.Sequential
    _recursive_: true
    _args_:
    - _target_: eztorch.transforms.ApplyTransformInputKey
      _recursive_: true
      transform:
        _target_: torch.nn.Sequential
        _args_:
        - _target_: torchaug.batch_transforms.BatchVideoWrapper
          same_on_frames: true
          video_format: CTHW
          inplace: true
          transforms:
          - _target_: torchaug.batch_transforms.BatchVideoResize
            antialias: true
            size:
            - 224
            - 224
            video_format: TCHW
          - _target_: eztorch.transforms.Div255Input
            inplace: true
          - _target_: torchaug.batch_transforms.BatchRandomColorJitter
            brightness: 0.4
            contrast: 0.4
            hue: 0.0
            p: 0.8
            saturation: 0.4
            inplace: true
          - _target_: torchaug.batch_transforms.BatchRandomGaussianBlur
            kernel_size: 23
            sigma:
            - 0.1
            - 2.0
            p: 0.5
            inplace: true
          - _target_: torchaug.batch_transforms.BatchRandomHorizontalFlip
            p: 0.5
            inplace: true
          - _target_: torchaug.transforms.Normalize
            mean:
            - 0.45
            - 0.45
            - 0.45
            std:
            - 0.225
            - 0.225
            - 0.225
            inplace: true
    - _target_: eztorch.transforms.video.soccernet.BatchReduceTimestamps
    - _target_: eztorch.transforms.video.spot.SpottingMixup
      alpha: 0.1
  val_transform:
    _target_: torch.nn.Sequential
    _recursive_: true
    _args_:
    - _target_: eztorch.transforms.video.soccernet.BatchReduceTimestamps
    - _target_: eztorch.transforms.ApplyTransformInputKey
      transform:
        _target_: torch.nn.Sequential
        _args_:
        - _target_: torchaug.batch_transforms.BatchVideoWrapper
          same_on_frames: true
          video_format: CTHW
          inplace: true
          transforms:
          - _target_: torchaug.batch_transforms.BatchVideoResize
            antialias: true
            size:
            - 224
            - 224
            video_format: TCHW
          - _target_: eztorch.transforms.Div255Input
            inplace: true
          - _target_: torchaug.transforms.Normalize
            mean:
            - 0.45
            - 0.45
            - 0.45
            std:
            - 0.225
            - 0.225
            - 0.225
            inplace: true
  save_val_preds_path: val_preds/
  save_test_preds_path: test_preds/
  NMS_args:
    window: 20
    threshold: 0.001
    min_weight: 0.0
    nms_type: soft
  evaluation_args:
    SoccerNet_path: ${paths.soccernet_labels_valid}
    split: valid
    version: 2
    metric: tight
  prediction_args:
    remove_inference_prediction_seconds: 12
    merge_predictions_type: max
  test_transform:
    _target_: torch.nn.Sequential
    _recursive_: true
    _args_:
    - _target_: eztorch.transforms.video.soccernet.BatchReduceTimestamps
    - _target_: eztorch.transforms.ApplyTransformInputKey
      transform:
        _target_: torch.nn.Sequential
        _args_:
        - _target_: torchaug.batch_transforms.BatchVideoWrapper
          same_on_frames: true
          video_format: CTHW
          inplace: true
          transforms:
          - _target_: torchaug.batch_transforms.BatchVideoResize
            antialias: true
            size:
            - 224
            - 224
            video_format: TCHW
          - _target_: eztorch.transforms.Div255Input
            inplace: true
          - _target_: torchaug.transforms.Normalize
            mean:
            - 0.45
            - 0.45
            - 0.45
            std:
            - 0.225
            - 0.225
            - 0.225
            inplace: true
seed:
  _target_: lightning.fabric.utilities.seed.seed_everything
  seed: 42
  workers: true
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  accelerator: gpu
  benchmark: true
  devices: auto
  max_epochs: 20
  num_nodes: 1
  precision: 16
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: false
    static_graph: false
  sync_batchnorm: false
  check_val_every_n_epoch: 5
  use_distributed_sampler: false
  gradient_clip_val: 1
ckpt_path: null
dir:
  data: ''
  root: ${paths.run_root}
  exp: finetune_classifier_backbone
  run: ${paths.run}
paths:
  frames: ???
  label_cache: ???
  run: ???
  run_root: ???
  soccernet_labels_valid: ???
  stage3_classifier_checkpoint: ???
