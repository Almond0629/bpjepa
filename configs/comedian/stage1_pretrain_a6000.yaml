# COMEDIAN stage1 recipe as run for the paper (resolved config, machine paths replaced by paths.*).
# Set paths.* on the Hydra command line; see REPRODUCE.md.
callbacks:
  model_checkpoint:
    _target_: eztorch.callbacks.ModelCheckpoint
    dirpath: pretrain_checkpoints
    filename: '{epoch}'
    save_last: true
    save_top_k: 0
    mode: min
    every_n_epochs: 1
  learning_rate_monitor:
    _target_: eztorch.callbacks.LearningRateMonitor
    logging_interval: null
    log_momentum: false
  progress_bar:
    _target_: eztorch.callbacks.TQDMProgressBar
    refresh_rate: 50
    process_position: 0
datamodule:
  _target_: eztorch.datamodules.SoccerNetDataModule
  _recursive_: false
  datadir: ${paths.frames}/train.json
  train:
    dataset:
      datadir: ${paths.frames}/train.json
      video_path_prefix: ${paths.frames}/train
      label_args: null
      feature_args: null
      task: action
    decoder_args:
      fps: 2
      num_threads_io: 4
      num_threads_decode: 4
      num_decode: 2
      time_difference_prob: 0.0
      mask_ratio: 0.0
      mask_tube: 2
      transform: null
    transform:
      _target_: eztorch.transforms.ApplyTransformInputKey
      _recursive_: true
      transform:
        _target_: eztorch.transforms.MultiCropTransform
        _recursive_: true
        set_transforms:
        - num_views: 2
          transform:
            _target_: torchvision.transforms.RandomResizedCrop
            size: 224
            scale:
            - 0.2
            - 1.0
            ratio:
            - 1.3275
            - 2.2125
            interpolation: 2
            antialias: true
    clip_sampler:
      _target_: eztorch.datasets.clip_samplers.soccernet.SlidingWindowSoccerNetClipSampler
      window_duration: 1.0
      overlap_window: 0.0
      shuffle: true
    loader:
      drop_last: true
      num_workers: 4
      pin_memory: true
    global_batch_size: 512
  val: null
  test: null
  video_path_prefix: ${paths.frames}/train.json
  decoder: frame
  decoder_args:
    fps: 2
    num_threads_io: 4
    num_threads_decode: 4
    num_decode: 1
    time_difference_prob: 0.0
    transform: null
    mask_ratio: 0.0
    mask_tube: 2
model:
  train_transform:
    _target_: eztorch.transforms.ApplyTransformsOnList
    _recursive_: true
    transforms:
    - _target_: torchaug.batch_transforms.BatchVideoWrapper
      same_on_frames: true
      video_format: CTHW
      inplace: true
      transforms:
      - _target_: eztorch.transforms.Div255Input
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomColorJitter
        brightness: 0.4
        contrast: 0.4
        hue: 0.1
        p: 0.8
        saturation: 0.2
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomGrayscale
        p: 0.2
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomGaussianBlur
        kernel_size: 23
        sigma:
        - 0.1
        - 2.0
        p: 1.0
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomHorizontalFlip
        p: 0.5
        inplace: true
      - _target_: torchaug.transforms.Normalize
        mean:
        - 0.45
        - 0.45
        - 0.45
        std:
        - 0.225
        - 0.225
        - 0.225
        inplace: true
    - _target_: torchaug.batch_transforms.BatchVideoWrapper
      same_on_frames: true
      video_format: CTHW
      inplace: true
      transforms:
      - _target_: eztorch.transforms.Div255Input
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomColorJitter
        brightness: 0.4
        contrast: 0.4
        hue: 0.1
        p: 0.8
        saturation: 0.2
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomGrayscale
        p: 0.2
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomGaussianBlur
        kernel_size: 23
        sigma:
        - 0.1
        - 2.0
        p: 0.1
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomSolarize
        p: 0.2
        threshold: 0.5
        inplace: true
      - _target_: torchaug.batch_transforms.BatchRandomHorizontalFlip
        p: 0.5
      - _target_: torchaug.transforms.Normalize
        mean:
        - 0.45
        - 0.45
        - 0.45
        std:
        - 0.225
        - 0.225
        - 0.225
        inplace: true
  _target_: eztorch.models.siamese.SCEModel
  _recursive_: false
  coeff: 1.0
  final_scheduler_coeff: 0.0
  initial_momentum: 0.99
  mutual_pass: true
  normalize_outputs: true
  num_devices: 1
  num_global_crops: 2
  num_local_crops: 0
  num_splits: 0
  num_splits_per_combination: 2
  optimizer:
    _target_: eztorch.optimizers.optimizer_factory
    _recursive_: false
    exclude_wd_norm: true
    exclude_wd_bias: true
    name: adamw
    params:
      weight_decay: 0.05
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      amsgrad: false
    batch_size: 512
    initial_lr: 0.0005
    layer_decay_lr: null
    scaler: linear
    scheduler:
      _target_: eztorch.schedulers.scheduler_factory
      _recursive_: false
      name: linear_warmup_cosine_annealing_lr
      params:
        max_epochs: 100
        warmup_epochs: 10
        warmup_start_lr: 0.0
        eta_min: 0.0
      interval: step
    keys_without_decay:
    - pos_embed
    - cls_token
  predictor:
    _target_: eztorch.models.heads.MLPHead
    activation_inplace: false
    activation_layer: gelu
    affine: false
    bias: true
    dropout: 0.0
    dropout_inplace: true
    hidden_dims:
    - 1024
    input_dim: 256
    norm_layer: null
    num_layers: 2
    last_bias: false
    last_norm: false
    last_affine: false
    output_dim: 256
  projector:
    _target_: eztorch.models.heads.MLPHead
    activation_inplace: false
    activation_layer: gelu
    affine: false
    bias: true
    dropout: 0.0
    dropout_inplace: true
    hidden_dims:
    - 1024
    - 1024
    input_dim: 192
    norm_layer: null
    num_layers: 3
    last_bias: true
    last_norm: false
    last_affine: false
    output_dim: 256
  queue:
    size: 65536
    feature_dim: 256
  scheduler_coeff: null
  scheduler_momentum: cosine
  simulate_n_devices: 8
  shuffle_bn: false
  start_warmup_coeff: 1.0
  sym: true
  temp: 0.1
  temp_m: 0.07
  trunk:
    _target_: eztorch.models.trunks.create_vit_tiny
    img_size: 224
    patch_size: 16
    in_chans: 3
    mlp_ratio: 4
    qkv_bias: true
    init_values: null
    class_token: true
    no_embed_class: false
    pre_norm: false
    drop_rate: 0
    attn_drop_rate: 0
    drop_path_rate: 0.1
    embed_layer: null
    norm_layer: null
    act_layer: null
    block_fn: null
    pretrain_pth: null
    conv_type: Conv3d
    tube_size: 2
  use_keys: false
  warmup_epoch_coeff: 0
  warmup_epoch_temp_m: 0
  warmup_scheduler_coeff: linear
  warmup_scheduler_temp_m: cosine
seed:
  _target_: lightning.fabric.utilities.seed.seed_everything
  seed: 42
  workers: true
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  accelerator: gpu
  benchmark: true
  devices: 2
  max_epochs: 100
  num_nodes: 1
  precision: 16
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: false
    static_graph: false
  sync_batchnorm: false
  log_every_n_steps: 50
  use_distributed_sampler: false
  gradient_clip_val: 1
ckpt_path: null
dir:
  data: ${paths.frames}/train.json
  root: ${paths.run_root}
  exp: pretrain_spatial
  run: ${paths.run}
paths:
  frames: ???
  run: ???
  run_root: ???
